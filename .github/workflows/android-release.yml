name: Android Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # AGP 8.5+ requires Java 17 or higher
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Assembles the release APK using Kotlin DSL
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: RelayControl-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION=${VERSION:-1.0}
          TAG="v${VERSION}"
          # tag already used by an earlier push: make it unique instead of failing
          if gh release view "$TAG" >/dev/null 2>&1; then TAG="v${VERSION}.${{ github.run_number }}"; fi
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --target "${{ github.sha }}" \
            --title "Relay Control $TAG" \
            --generate-notes
